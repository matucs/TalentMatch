name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0.10
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.0.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:3.1.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm vitest run apps/api/src/modules/jobs/adapters/mongo-job-repository.integration.test.ts
        env:
          RUN_INTEGRATION: "true"
          MONGODB_URI: mongodb://localhost:27017
      - run: pnpm vitest run apps/api/src/modules/applications/adapters/mongo-application-repository.integration.test.ts
        env:
          RUN_INTEGRATION: "true"
          MONGODB_URI: mongodb://localhost:27017
      - run: pnpm vitest run apps/worker/src/application-scorer.integration.test.ts
        env:
          RUN_INTEGRATION: "true"
          MONGODB_URI: mongodb://localhost:27017
      - run: pnpm vitest run apps/api/src/modules/search/adapters/search-infrastructure.integration.test.ts
        env:
          RUN_SEARCH_INTEGRATION: "true"
          OPENSEARCH_NODE: http://localhost:9200
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
